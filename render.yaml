# Render Blueprint. Point Render at this repo and the only field you must fill
# in is the API key, which Render prompts for because GROQ_API_KEY is sync: false.
#
# The index is built during the deploy, not committed:
#   data/docs/ is tracked, so `python src/embed.py` chunks those pages, embeds
#   them and writes data/chroma/ on the build instance. data/chroma/ is
#   deliberately untracked (.gitignore) - the SQLite and HNSW binaries change
#   byte-for-byte whenever the collection is opened, so tracking them produced
#   churn on every run and pushed ~2 MB of regenerable artifacts into history.
#
# Consequences worth knowing:
#   - Embeddings run through fastembed/ONNX, not torch, so there is no ~2 GB
#     wheel to install. That is what makes the free tier viable on disk.
#   - The free tier's disk is ephemeral, so data/chroma/ can vanish on restart
#     or redeploy. src/app.py handles that: warm_index() rebuilds from the
#     tracked data/docs/ pages on first use if the index is missing. The build
#     step below avoids paying that cost on a healthy deploy.
#   - The deployed app answers as of the fetched_at date in the tracked
#     data/docs/*.meta.json sidecars, and states that date in every footer.
#   - To refresh the corpus, re-run load.py / chunk.py / embed.py locally and
#     commit the updated data/docs/ sidecars. See README.md.
#
# Note: `python src/embed.py` is the module that owns build_index(). There is no
# src/ingest/run.py, and none is needed - chunking happens inside build_index()
# from the tracked pages, so no separate chunk.py call or network fetch is needed.
#
# IMPORTANT: this file is only read when the service is created via
# New -> Blueprint. A service created from the dashboard ignores this file
# entirely and uses whatever Build/Start/Env you type into its settings, so keep
# those in sync by hand. The env vars below are the ones the code reads.

services:
  - type: web
    name: mf-facts
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r requirements.txt
      && python src/embed.py
    startCommand: >-
      streamlit run src/app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GENERATOR_BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/openai/gpt-oss-120b
      - key: GENERATOR_VERBOSE
        value: "0"
      # Per-stage timings. On by default in src/embed.py; set explicitly so the
      # behaviour is visible in this file rather than implied by code.
      - key: RAG_PERF
        value: "1"
